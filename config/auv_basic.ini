[base]
env_name = auv_basic

[vec]
total_agents = 4096
num_buffers = 3

[policy]
num_layers = 1
hidden_size = 512

[train]
total_timesteps = 2_000_000_000
learning_rate = 0.0052607
gamma = 0.969712
gae_lambda = 0.969741
ent_coef = 0.007932
clip_coef = 0.01
vf_coef = 2.39937
vf_clip_coef = 0.01
max_grad_norm = 0.373292
minibatch_size = 16384
horizon = 64
replay_ratio = 1.61759
beta1 = 0.976703
beta2 = 0.99109
vtrace_rho_clip = 0.535833
vtrace_c_clip = 2.03778
prio_alpha = 0.88582
prio_beta0 = 0.260209
anneal_lr = 1


[sweep]
downsample = 10
sweep_only = learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, vf_coef, max_grad_norm
