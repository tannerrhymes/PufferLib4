[base]
env_name = auv_basic

[vec]
total_agents = 4096

[policy]
hidden_size = 128
num_layers = 1

[train]
total_timesteps = 20_000_000_000
gamma = 0.99
learning_rate = 0.005
minibatch_size = 32768
ent_coef = 0.01

[sweep]
method = Protein
metric = score
goal = maximize
max_runs = 20
gpus = 1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.total_timesteps]
distribution = log_normal
min = 30_000_000
max = 1_000_000_000
scale = time
